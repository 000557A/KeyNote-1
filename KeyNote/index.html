<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Keynote</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Title screen (auto-advances after 5s). Swap .knob for <img src="logo.png"> when your logo is ready. -->
  <section id="title" class="screen active">
    <div class="knob"><i></i></div>
    <h1>Key<span>note</span></h1>
    <p>a game of keys and rhythm</p>
    <div class="dots"><b></b><b></b><b></b></div>
  </section>

  <!-- Song select -->
  <section id="select" class="screen">
    <header>
      <div><h2>Select a Song</h2><p>choose a track to play</p></div>
      <button id="add" title="Add a song">+</button>
    </header>
    <ul id="list"></ul>
    <footer>Songs are saved in this browser. Right-click a song to edit its BPM or remove it.</footer>
    <input id="file" type="file" accept="audio/*" multiple hidden>
  </section>

  <!-- Game -->
  <section id="game" class="screen">
    <canvas id="cv"></canvas>
    <div id="overlay" hidden>
      <p id="ohead"></p><h2 id="oscore"></h2><p id="odetail"></p>
      <button id="back">Back to song select</button>
    </div>
  </section>

  <script src="game.js"></script>
</body>
</html>
